<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img">
<style>text{font-family:'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}.tw{opacity:0.8;animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}.au{animation:au 9s ease-in-out infinite}@keyframes au{50%{transform:translateX(-30px)}}.wave{transform-origin:44px 6px;animation:wv 2.6s ease-in-out infinite}@keyframes wv{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-22deg)}85%{transform:rotate(8deg)}}.blink{transform-origin:0 -36px;animation:bl 5s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#0F1A33"/></linearGradient>
  <linearGradient id="au" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".4" stop-color="#5EEAD4"/><stop offset=".7" stop-color="#7DD3FC"/><stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#E8EEF7"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="clip"><rect width="840" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
