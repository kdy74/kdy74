  <g class="au" opacity="0.35" filter="url(#blur)"><path d="M380 70 C500 10 620 120 740 50 S900 40 900 40 L900 110 C780 170 640 80 520 140 S380 130 380 130Z" fill="url(#au)"/></g>
  <circle class="tw" cx="470" cy="40" r="1.4" fill="#F8FAFC" style="animation-delay:0s"/><circle class="tw" cx="520" cy="92" r="1" fill="#F8FAFC" style="animation-delay:1.2s"/><circle class="tw" cx="612" cy="28" r="1.6" fill="#F8FAFC" style="animation-delay:0.6s"/><circle class="tw" cx="700" cy="70" r="1.1" fill="#F8FAFC" style="animation-delay:2s"/><circle class="tw" cx="780" cy="30" r="1.3" fill="#F8FAFC" style="animation-delay:1.5s"/><circle class="tw" cx="808" cy="120" r="1" fill="#F8FAFC" style="animation-delay:0.3s"/><circle class="tw" cx="430" cy="130" r="1" fill="#F8FAFC" style="animation-delay:2.4s"/><circle class="tw" cx="560" cy="150" r="1.2" fill="#F8FAFC" style="animation-delay:1.8s"/>
