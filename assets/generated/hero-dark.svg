<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img">
<style>text{font-family:'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.orb{animation:pulse 6s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#131B3A"/></linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22C55E" stop-opacity="0.45"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.30"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1B2547" stroke-width="1"/></pattern>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#86EFAC"/></linearGradient>
  <clipPath id="clip"><rect width="840" height="300" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="840" height="300" fill="url(#bg)"/>
  <rect width="840" height="300" fill="url(#grid)" opacity="0.55"/>
  <circle class="orb" cx="760" cy="40" r="190" fill="url(#orb)"/>
  <circle class="orb" cx="80" cy="300" r="170" fill="url(#orb2)" style="animation-delay:3s"/>
</g>
<rect x="0.5" y="0.5" width="839" height="299" rx="18" fill="none" stroke="#22305A"/>
<g>
  <text x="40" y="70" class="mono" font-size="13" fill="#22C55E" letter-spacing="3">XIN CHÀO · HELLO</text>
  <text x="40" y="122" font-size="44" font-weight="800" fill="url(#name)">Mundo</text>
  <text x="40" y="158" font-size="19" font-weight="600" fill="#E6EDF3">Full-stack Software Engineer</text>
  <text x="40" y="186" font-size="14" fill="#8B98B8">Turning messy workflows into calm, reliable software.</text>
</g>
<rect x="40" y="218" width="152" height="28" rx="14" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.55"/><circle cx="53" cy="232" r="3.5" fill="#22C55E"/><text x="62" y="236.5" font-size="12.5" fill="#E6EDF3">AI-native workspace</text><rect x="201.5" y="218" width="138" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/><circle cx="214.5" cy="232" r="3.5" fill="#22D3EE"/><text x="223.5" y="236.5" font-size="12.5" fill="#E6EDF3">Local-first tools</text><rect x="350.0" y="218" width="67" height="28" rx="14" fill="#A3E635" fill-opacity="0.12" stroke="#A3E635" stroke-opacity="0.55"/><circle cx="363.0" cy="232" r="3.5" fill="#A3E635"/><text x="372.0" y="236.5" font-size="12.5" fill="#E6EDF3">Hà Nội</text>
<!-- terminal -->
<rect x="482" y="62" width="326" height="222" rx="12" fill="#0A0F1E" stroke="#22305A"/>
<rect x="482" y="62" width="326" height="28" rx="12" fill="#151E3F"/><rect x="482" y="80" width="326" height="10" fill="#151E3F"/>
<circle cx="500" cy="76" r="5" fill="#FF5F57"/><circle cx="516" cy="76" r="5" fill="#FEBC2E"/><circle cx="532" cy="76" r="5" fill="#28C840"/>
<text x="645" y="80" class="mono" font-size="11" fill="#8B98B8" text-anchor="middle">mundo@hanoi: ~</text>
<g><text x="502" y="110" class="mono" font-size="12.5" fill="#A3E635">$</text><text x="520" y="110" class="mono" font-size="12.5" fill="#E6EDF3">whoami</text></g><g><text x="502" y="130" class="mono" font-size="12.5" fill="#34D399">›</text><text x="520" y="130" class="mono" font-size="12.5" fill="#34D399">mundo · full-stack engineer · Hà Nội</text></g><g><text x="502" y="150" class="mono" font-size="12.5" fill="#A3E635">$</text><text x="520" y="150" class="mono" font-size="12.5" fill="#E6EDF3">cat focus.txt</text></g><g><text x="502" y="170" class="mono" font-size="12.5" fill="#22D3EE">›</text><text x="520" y="170" class="mono" font-size="12.5" fill="#22D3EE">AI-native workspaces</text></g><g><text x="502" y="190" class="mono" font-size="12.5" fill="#22D3EE">›</text><text x="520" y="190" class="mono" font-size="12.5" fill="#22D3EE">secure backend platforms</text></g><g><text x="502" y="210" class="mono" font-size="12.5" fill="#22D3EE">›</text><text x="520" y="210" class="mono" font-size="12.5" fill="#22D3EE">local-first desktop tools</text></g><g><text x="502" y="230" class="mono" font-size="12.5" fill="#A3E635">$</text><text x="520" y="230" class="mono" font-size="12.5" fill="#E6EDF3">otter restore --verify</text></g><g><text x="502" y="250" class="mono" font-size="12.5" fill="#34D399">✓</text><text x="520" y="250" class="mono" font-size="12.5" fill="#34D399">context restored · all checks green</text></g>
<rect class="cur" x="502" y="259" width="8" height="14" fill="#22C55E"/>

</svg>
