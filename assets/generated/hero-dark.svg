<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img">
<style>text{font-family:'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}.spin{animation:sp 18s linear infinite}.spin2{animation:sp 28s linear infinite reverse}@keyframes sp{to{transform:rotate(360deg)}}.tw{opacity:0.8;animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}.au{animation:au 9s ease-in-out infinite}@keyframes au{50%{transform:translateX(-30px)}}</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#0F1A33"/></linearGradient>
  <linearGradient id="au" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".4" stop-color="#5EEAD4"/><stop offset=".7" stop-color="#7DD3FC"/><stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#E8EEF7"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E3A5F"/><stop offset="1" stop-color="#0B1630"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="clip"><rect width="840" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="840" height="300" fill="url(#bg)"/>
  <g class="au" opacity="0.35" filter="url(#blur)"><path d="M380 70 C500 10 620 120 740 50 S900 40 900 40 L900 110 C780 170 640 80 520 140 S380 130 380 130Z" fill="url(#au)"/></g>
  <circle class="tw" cx="470" cy="40" r="1.4" fill="#F8FAFC" style="animation-delay:0s"/><circle class="tw" cx="520" cy="92" r="1" fill="#F8FAFC" style="animation-delay:1.2s"/><circle class="tw" cx="612" cy="28" r="1.6" fill="#F8FAFC" style="animation-delay:0.6s"/><circle class="tw" cx="700" cy="70" r="1.1" fill="#F8FAFC" style="animation-delay:2s"/><circle class="tw" cx="780" cy="30" r="1.3" fill="#F8FAFC" style="animation-delay:1.5s"/><circle class="tw" cx="808" cy="120" r="1" fill="#F8FAFC" style="animation-delay:0.3s"/><circle class="tw" cx="430" cy="130" r="1" fill="#F8FAFC" style="animation-delay:2.4s"/><circle class="tw" cx="560" cy="150" r="1.2" fill="#F8FAFC" style="animation-delay:1.8s"/>
  <path d="M520 300 L600 238 L640 258 L700 214 L780 262 L840 236 L840 300Z" fill="#7DD3FC" fill-opacity="0.10"/>
  <path d="M440 300 C520 278 640 282 840 290 L840 300Z" fill="#F8FAFC" fill-opacity="0.08"/>
</g>
<rect x="0.5" y="0.5" width="839" height="299" rx="20" fill="none" stroke="#1F2A44"/>
<text x="48" y="74" class="mono" font-size="13" fill="#7DD3FC" letter-spacing="3">XIN CHÀO, MÌNH LÀ</text>
<text x="46" y="138" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1.5">penguy<tspan fill="#FB923C">.</tspan></text>
<text x="48" y="174" font-size="19" font-weight="600" fill="#E8EEF7">Full-stack Software Engineer</text>
<text x="48" y="200" font-size="14.5" fill="#8A97B1">Biến những quy trình rối rắm thành phần mềm gọn gàng, đáng tin.</text>
<rect x="48" y="228" width="100" height="30" rx="15" fill="#7DD3FC" fill-opacity="0.10" stroke="#7DD3FC" stroke-opacity="0.45"/><circle cx="62" cy="243" r="3.5" fill="#7DD3FC"/><text x="72" y="247.5" font-size="13" fill="#E8EEF7">Full-stack</text><rect x="158.0" y="228" width="156" height="30" rx="15" fill="#5EEAD4" fill-opacity="0.10" stroke="#5EEAD4" stroke-opacity="0.45"/><circle cx="172.0" cy="243" r="3.5" fill="#5EEAD4"/><text x="182.0" y="247.5" font-size="13" fill="#E8EEF7">AI-native products</text><rect x="324.0" y="228" width="107" height="30" rx="15" fill="#FB923C" fill-opacity="0.10" stroke="#FB923C" stroke-opacity="0.45"/><circle cx="338.0" cy="243" r="3.5" fill="#FB923C"/><text x="348.0" y="247.5" font-size="13" fill="#E8EEF7">Hà Nội · VN</text>

<g transform="translate(690 150)">
  <circle r="104" fill="none" stroke="#7DD3FC" stroke-opacity="0.18" stroke-dasharray="2 7"/>
  <circle r="80" fill="none" stroke="#7DD3FC" stroke-opacity="0.28"/>
  <g class="spin"><circle cx="80" cy="0" r="5" fill="#7DD3FC"/><circle cx="-80" cy="0" r="3" fill="#5EEAD4"/></g>
  <g class="spin2"><circle cx="0" cy="-104" r="4" fill="#FB923C"/><circle cx="0" cy="104" r="2.5" fill="#A5B4FC"/></g>
  <rect x="-52" y="-52" width="104" height="104" rx="28" fill="url(#tile)" stroke="#7DD3FC" stroke-opacity="0.55"/>
  <rect x="-52" y="-52" width="104" height="52" rx="28" fill="#F8FAFC" fill-opacity="0.07"/>
  <text x="-4" y="22" font-size="66" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="-2">p<tspan fill="#FB923C">.</tspan></text>
</g>

</svg>
