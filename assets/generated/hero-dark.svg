</g>
<rect x="0.5" y="0.5" width="839" height="299" rx="20" fill="none" stroke="#1F2A44"/>
<text x="48" y="74" class="mono" font-size="13" fill="#7DD3FC" letter-spacing="3">XIN CHÀO, MÌNH LÀ</text>
<text x="46" y="138" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1.5">penguy<tspan fill="#FB923C">.</tspan></text>
<text x="48" y="174" font-size="19" font-weight="600" fill="#E8EEF7">Full-stack Software Engineer</text>
<text x="48" y="200" font-size="14.5" fill="#8A97B1">Biến những quy trình rối rắm thành phần mềm gọn gàng, đáng tin.</text>
<rect x="48" y="228" width="100" height="30" rx="15" fill="#7DD3FC" fill-opacity="0.10" stroke="#7DD3FC" stroke-opacity="0.45"/><circle cx="62" cy="243" r="3.5" fill="#7DD3FC"/><text x="72" y="247.5" font-size="13" fill="#E8EEF7">Full-stack</text><rect x="158.0" y="228" width="156" height="30" rx="15" fill="#5EEAD4" fill-opacity="0.10" stroke="#5EEAD4" stroke-opacity="0.45"/><circle cx="172.0" cy="243" r="3.5" fill="#5EEAD4"/><text x="182.0" y="247.5" font-size="13" fill="#E8EEF7">AI-native products</text><rect x="324.0" y="228" width="107" height="30" rx="15" fill="#FB923C" fill-opacity="0.10" stroke="#FB923C" stroke-opacity="0.45"/><circle cx="338.0" cy="243" r="3.5" fill="#FB923C"/><text x="348.0" y="247.5" font-size="13" fill="#E8EEF7">Hà Nội · VN</text>

