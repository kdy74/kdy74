<text x="48" y="74" class="mono" font-size="13" fill="#0284C7" letter-spacing="3">XIN CHÀO, MÌNH LÀ</text>
<text x="46" y="138" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1.5">penguy<tspan fill="#EA580C">.</tspan></text>
<text x="48" y="174" font-size="19" font-weight="600" fill="#0F172A">Full-stack Software Engineer</text>
<text x="48" y="200" font-size="14.5" fill="#5B6678">Biến những quy trình rối rắm thành phần mềm gọn gàng, đáng tin.</text>
