<svg xmlns="http://www.w3.org/2000/svg" width="840" height="226" viewBox="0 0 840 226" role="img">
<style>text{font-family:'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="410" height="103" rx="14" fill="#FFFFFF" stroke="#DDE2E9"/><text x="24.5" y="40.5" class="mono" font-size="12" font-weight="700" fill="#0369A1">01</text><text x="54.5" y="41.5" font-size="16" font-weight="700" fill="#0F172A">Evidence over assumptions</text><text x="54.5" y="68.5" font-size="13" fill="#64748B">Every claim ships with a command, a log or a link.</text>
<rect x="429.5" y="0.5" width="410" height="103" rx="14" fill="#FFFFFF" stroke="#DDE2E9"/><text x="453.5" y="40.5" class="mono" font-size="12" font-weight="700" fill="#0369A1">02</text><text x="483.5" y="41.5" font-size="16" font-weight="700" fill="#0F172A">Small, reversible changes</text><text x="483.5" y="68.5" font-size="13" fill="#64748B">One slice, one branch, one reviewable pull request.</text>
<rect x="0.5" y="122.5" width="410" height="103" rx="14" fill="#FFFFFF" stroke="#DDE2E9"/><text x="24.5" y="162.5" class="mono" font-size="12" font-weight="700" fill="#0369A1">03</text><text x="54.5" y="163.5" font-size="16" font-weight="700" fill="#0F172A">Secure by default</text><text x="54.5" y="190.5" font-size="13" fill="#64748B">Permissions, audit and secrets are designed in on day one.</text>
<rect x="429.5" y="122.5" width="410" height="103" rx="14" fill="#FFFFFF" stroke="#DDE2E9"/><text x="453.5" y="162.5" class="mono" font-size="12" font-weight="700" fill="#0369A1">04</text><text x="483.5" y="163.5" font-size="16" font-weight="700" fill="#0F172A">Tests that can fail</text><text x="483.5" y="190.5" font-size="13" fill="#64748B">If breaking the code doesn&#x27;t break the test, it isn&#x27;t a test.</text>
</svg>
